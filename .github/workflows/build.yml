name: Start build
on:
  workflow_dispatch:

jobs:
  Building:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout Kernel Source
      uses: actions/checkout@v5
      with:
        repository: r0xx3z/android_kernel_sony_pine
        ref: cm-14.1
        path: kernel

    - name: 📦 Install Dependencies
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison aptitude git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev -y

    - name: 🔧 Clone Toolchain 
      run: |
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b nougat-release aarch64-linux-android-4.9

    - name: 📁 Create Output Directory
      run: mkdir -p KERNEL_OUT

    - name: ⚙️ Setup Environment
      run: |
        echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/aarch64-linux-android-4.9" >> $GITHUB_ENV
        echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV
        echo "OUT_DIR=$GITHUB_WORKSPACE/KERNEL_OUT" >> $GITHUB_ENV

    - name: 🛠️ Build Defconfig
      run: |
        export PATH="$TOOLCHAIN_PATH/bin:$PATH"
        make -C $KERNEL_DIR O=$OUT_DIR ARCH=arm64 \
          CROSS_COMPILE=$TOOLCHAIN_PATH/bin/aarch64-linux-android- \
          pine_defconfig

    - name: 🛠️ Build Kernel
      run: |
        export PATH="$TOOLCHAIN_PATH/bin:$PATH"
        make -C $KERNEL_DIR O=$OUT_DIR ARCH=arm64 \
          CROSS_COMPILE=$TOOLCHAIN_PATH/bin/aarch64-linux-android- \
          -j$(nproc --all)

    - name: 📤 Upload Kernel Output
      uses: actions/upload-artifact@v4
      with:
        name: KERNEL_OUT
        path: KERNEL_OUT/
